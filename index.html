<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/master.css">
    <title>Weather Forecast App</title>
</head>
<body>
    <header>
        <h1>Weather Forecast</h1>
        <p class="tagline">7-day outlook · live conditions · air quality</p>
    </header>

    <main>
        <form id="location-form" class="search-panel">
            <label for="city-select">City</label>
            <select id="city-select" name="city" required>
                <option value="">Choose a city…</option>
            </select>
            <button type="submit">Get forecast</button>
        </form>

        <section id="current-panel" class="current-panel hidden" aria-live="polite"></section>

        <section id="weather-forecast" class="card-container" aria-live="polite"></section>
    </main>

    <footer>
        <p>Data: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> ·
           <a href="http://www.7timer.info/" target="_blank" rel="noopener">7Timer!</a></p>
        <p>&copy; 2024 Akshay Jagtap</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
